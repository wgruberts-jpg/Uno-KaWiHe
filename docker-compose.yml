  #   restart: unless-stopped
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=3000
  #     - AUTH_SERVICE_URL=http://kawihe-auth:4000
  #   depends_on:
  #     - kawihe-auth
  #   networks:
  #     - kawihe-net

volumes:
  auth-data:

networks:
  kawihe-net:
    name: kawihe-net
