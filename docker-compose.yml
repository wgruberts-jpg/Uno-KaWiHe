# Docker Compose para Hospedar UNO e Microserviço Central de Autenticação KaWiHe
services:
  # SERVIÇO CENTRAL DE AUTENTICAÇÃO (SSO / Contas para todos os jogos)
  kawihe-auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: kawihe-auth
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - auth-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=kawihe_jwt_super_secret_key_2026
      - ADMIN_PIN=1234
    networks:
      - kawihe-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # JOGO 1: UNO Multiplayer
  uno-game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uno-game
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://kawihe-auth:4000
      - JWT_SECRET=kawihe_jwt_super_secret_key_2026
      - ADMIN_PIN=1234
    depends_on:
      - kawihe-auth
    networks:
      - kawihe-net
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          memory: 128M

  # ==============================================================
  # EXEMPLO: COMO CONECTAR UM SEGUNDO JOGO AO MESMO SERVIÇO DE AUTH
